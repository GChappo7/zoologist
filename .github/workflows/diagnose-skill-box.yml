name: Repair OSRS skill box slashes

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install image processing dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless

      - name: Detect slash from edited Attack JPG and repair all skill boxes
        run: |
          python <<'PY'
          from pathlib import Path
          import cv2
          import numpy as np
          from PIL import Image

          root = Path("public/assets/ui/skills")
          reference_png = root / "Attack Box.png"
          reference_jpg = root / "Attack Box.jpg"

          ref_png = Image.open(reference_png).convert("RGBA")
          ref_jpg = Image.open(reference_jpg).convert("RGB")

          if ref_png.size != ref_jpg.size:
              raise SystemExit(f"Attack PNG/JPG dimensions differ: {ref_png.size} vs {ref_jpg.size}")

          png = np.array(ref_png)
          jpg = np.array(ref_jpg)
          p = png[:, :, :3].astype(np.int16)
          j = jpg.astype(np.int16)
          p_luma = p.mean(axis=2)
          j_luma = j.mean(axis=2)
          delta = j_luma - p_luma

          mask = ((p_luma < 70) & (delta > 22) & (png[:, :, 3] > 10)).astype(np.uint8) * 255
          mask = cv2.morphologyEx(mask, cv2.MORPH_CLOSE, np.ones((3, 3), np.uint8), iterations=1)

          n, labels, stats, _ = cv2.connectedComponentsWithStats(mask, 8)
          h, w = mask.shape
          components = []
          for idx in range(1, n):
              x, y, cw, ch, area = stats[idx]
              if area < max(8, int(w * h * 0.001)):
                  continue
              aspect = max(cw, ch) / max(1, min(cw, ch))
              if aspect < 1.25:
                  continue
              components.append((area, x, y, cw, ch, aspect))

          print(f"Attack image size: {w}x{h}")
          print("Slash candidates:", components)

          if not components:
              raise SystemExit("Could not confidently identify the Attack slash.")

          components.sort(reverse=True)
          best = components[0]
          if best[0] < max(20, int(w * h * 0.002)):
              raise SystemExit(f"Detected slash candidate is too small: {best}")

          candidate = (labels == next(
              idx for idx in range(1, n)
              if tuple(stats[idx]) == tuple(best[:5])
          )).astype(np.uint8) * 255
          candidate = cv2.dilate(candidate, np.ones((3, 3), np.uint8), iterations=1)

          changed = []
          for path in sorted(root.glob("* Box.png")):
              im = Image.open(path).convert("RGBA")
              if im.size != ref_png.size:
                  print(f"Skipping different-sized asset: {path.name} {im.size}")
                  continue

              rgba = np.array(im)
              rgb = cv2.cvtColor(rgba[:, :, :3], cv2.COLOR_RGB2BGR)
              repaired_bgr = cv2.inpaint(rgb, candidate, 3, cv2.INPAINT_TELEA)
              repaired_rgb = cv2.cvtColor(repaired_bgr, cv2.COLOR_BGR2RGB)

              out = rgba.copy()
              out[:, :, :3] = repaired_rgb
              Image.fromarray(out, "RGBA").save(path, optimize=True)
              if not np.array_equal(rgba, out):
                  changed.append(path.name)

          print(f"Repaired {len(changed)} PNG skill boxes:")
          for name in changed:
              print(" ", name)
          PY

      - name: Commit repaired PNG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "public/assets/ui/skills/"*.png
          if git diff --cached --quiet; then
            echo "No PNG changes required."
            exit 0
          fi
          git commit -m "Remove black slash from OSRS skill box assets"
          git push

# Trigger repair workflow after installation.
