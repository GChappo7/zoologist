name: Verify repaired OSRS skill boxes

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export repaired skill boxes
        uses: actions/upload-artifact@v4
        with:
          name: repaired-skill-box-assets
          path: |
            public/assets/ui/skills/Attack Box.png
            public/assets/ui/skills/Cooking Box.png
          retention-days: 3
