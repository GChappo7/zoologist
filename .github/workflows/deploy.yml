name: Deploy Zoologist to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install OSRS fonts
        run: |
          mkdir -p public/fonts
          curl -L --fail --retry 3 https://github.com/RuneStar/fonts/releases/download/1.103-0/RuneScape-Fonts.zip -o /tmp/RuneScape-Fonts.zip
          PLAIN=$(unzip -Z1 /tmp/RuneScape-Fonts.zip | grep -E '(^|/)RuneScape-Plain-12\.ttf$' | head -1)
          BOLD=$(unzip -Z1 /tmp/RuneScape-Fonts.zip | grep -E '(^|/)RuneScape-Bold-12\.ttf$' | head -1)
          test -n "$PLAIN" && test -n "$BOLD"
          unzip -p /tmp/RuneScape-Fonts.zip "$PLAIN" > public/fonts/RuneScape-Plain-12.ttf
          unzip -p /tmp/RuneScape-Fonts.zip "$BOLD" > public/fonts/RuneScape-Bold-12.ttf

      - name: Download achievement diary region icons
        run: |
          mkdir -p public/assets/ui/diaries
          curl -L --fail --retry 3 https://oldschool.runescape.wiki/images/Ardougne_icon_detail.png -o public/assets/ui/diaries/Ardougne.png
          curl -L --fail --retry 3 https://oldschool.runescape.wiki/images/Desert_icon_detail.png -o public/assets/ui/diaries/Desert.png
          curl -L --fail --retry 3 https://oldschool.runescape.wiki/images/Falador_icon_detail.png -o public/assets/ui/diaries/Falador.png
          curl -L --fail --retry 3 https://oldschool.runescape.wiki/images/Fremennik_icon_detail.png -o public/assets/ui/diaries/Fremennik.png
          curl -L --fail --retry 3 https://oldschool.runescape.wiki/images/Kandarin_icon_detail.png -o public/assets/ui/diaries/Kandarin.png
          curl -L --fail --retry 3 https://oldschool.runescape.wiki/images/Karamja_icon_detail.png -o public/assets/ui/diaries/Karamja.png
          curl -L --fail --retry 3 https://oldschool.runescape.wiki/images/Kourend_%26_Kebos_icon_detail.png -o public/assets/ui/diaries/Kourend_Kebos.png
          curl -L --fail --retry 3 https://oldschool.runescape.wiki/images/Lumbridge_%26_Draynor_icon_detail.png -o public/assets/ui/diaries/Lumbridge_Draynor.png
          curl -L --fail --retry 3 https://oldschool.runescape.wiki/images/Morytania_icon_detail.png -o public/assets/ui/diaries/Morytania.png
          curl -L --fail --retry 3 https://oldschool.runescape.wiki/images/Varrock_icon_detail.png -o public/assets/ui/diaries/Varrock.png
          curl -L --fail --retry 3 https://oldschool.runescape.wiki/images/Western_Provinces_icon_detail.png -o public/assets/ui/diaries/Western_Provinces.png
          curl -L --fail --retry 3 https://oldschool.runescape.wiki/images/Wilderness_icon_detail.png -o public/assets/ui/diaries/Wilderness.png

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_DEPLOYMENT_SHA: ${{ github.sha }}
          VITE_DEPLOYMENT_RUN: ${{ github.run_number }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
# Manual deployment trigger
