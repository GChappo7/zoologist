name: Export OSRS skill box assets for repair

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload skill box assets
        uses: actions/upload-artifact@v4
        with:
          name: skill-box-assets-for-repair
          path: public/assets/ui/skills/
          retention-days: 3
