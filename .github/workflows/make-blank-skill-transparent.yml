name: Make blank skill box transparent

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  process:
    if: !startsWith(github.event.head_commit.message, 'chore: make blank skill box transparent')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --quiet Pillow
      - name: Remove white corner background
        run: |
          python - <<'PY'
          from PIL import Image
          from collections import deque

          src = "public/assets/ui/skills/Blank Skill.jpg"
          dst = "public/assets/ui/skills/Blank Skill.png"

          im = Image.open(src).convert("RGBA")
          w, h = im.size
          px = im.load()
          q = deque()
          seen = set()

          # Flood-fill only the white/off-white background connected to the image corners.
          # This avoids making any isolated white detail inside the box transparent.
          for p in [(0,0), (w-1,0), (0,h-1), (w-1,h-1)]:
              if p not in seen:
                  seen.add(p)
                  q.append(p)

          def whiteish(x, y):
              r, g, b, a = px[x, y]
              return r >= 245 and g >= 245 and b >= 245

          while q:
              x, y = q.popleft()
              if not whiteish(x, y):
                  continue
              px[x, y] = (px[x, y][0], px[x, y][1], px[x, y][2], 0)
              for nx, ny in ((x-1,y),(x+1,y),(x,y-1),(x,y+1)):
                  if 0 <= nx < w and 0 <= ny < h and (nx, ny) not in seen:
                      if whiteish(nx, ny):
                          seen.add((nx, ny))
                          q.append((nx, ny))

          # Verify all four corners are transparent.
          for p in [(0,0), (w-1,0), (0,h-1), (w-1,h-1)]:
              if px[p[0], p[1]][3] != 0:
                  raise SystemExit(f"Corner {p} was not made transparent")

          im.save(dst, "PNG")
          print(f"Created {dst}: {w}x{h}")
          PY
      - name: Commit transparent PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "public/assets/ui/skills/Blank Skill.png"
          git commit -m "chore: make blank skill box transparent"
          git push
